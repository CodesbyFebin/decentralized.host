name: dhost

networks:
  dhost-mesh:
    name: dhost-mesh

volumes:
  pgdata:
  registry-data:
  traefik-dynamic:
  git-repos:
  git-ssh-host-keys:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhost
      POSTGRES_PASSWORD: dhost
      POSTGRES_DB: dhost
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dhost-mesh]

  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    networks: [dhost-mesh]

  traefik:
    image: traefik:v3.3
    # Routing config comes from the node agent, which writes one file per
    # deployment into traefik-dynamic/ (see node-agent/agent.py). We use the
    # file provider rather than the docker provider: Traefik's docker
    # provider fails Docker API version negotiation against Colima's socket
    # ("client version 1.24 is too old"), a known Traefik/Colima
    # incompatibility unrelated to this project. The file provider sidesteps
    # it entirely and also means Traefik doesn't need docker.sock access.
    restart: unless-stopped
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - traefik-dynamic:/etc/traefik/dynamic
    networks: [dhost-mesh]

  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://dhost:dhost@postgres:5432/dhost
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dhost-mesh]

  node-agent:
    build:
      context: .
      dockerfile: node-agent/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      NODE_NAME: local-node-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik-dynamic:/etc/traefik/dynamic
    ports:
      - "8100:8100"
    depends_on:
      - control-plane
    networks: [dhost-mesh]

  # The landing page (web/) is no longer served by a standalone container --
  # it's shipped through the mesh itself as a real deployment ("dhost ship"
  # from inside web/), the same way any other app is. That's the whole
  # point: this project hosts its own site. See it via the OpenGit Console
  # or at http://<name>.<BASE_DOMAIN> after shipping.

  dashboard:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./dashboard/public:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/.htpasswd:/etc/nginx/.htpasswd:ro
    ports:
      - "4001:80"
    networks: [dhost-mesh]

  # Real git server: `git clone`/`git push` over SSH. First push to any
  # repo name auto-creates it; pushing the default branch triggers a real
  # build+deploy through the same pipeline as `dhost ship` (see
  # git-server/post-receive.template -> POST /deployments/push).
  git-server:
    build:
      context: .
      dockerfile: git-server/Dockerfile
    restart: unless-stopped
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      DEPLOY_API_KEY: ${DEPLOY_API_KEY:-dev-deploy-key}
    volumes:
      - git-repos:/repos
      - git-ssh-host-keys:/etc/ssh
    ports:
      - "2222:22"
    depends_on:
      - control-plane
    networks: [dhost-mesh]
