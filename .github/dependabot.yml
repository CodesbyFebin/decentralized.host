version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/marketing-site"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/control-plane"
    schedule:
      interval: "weekly"
    groups:
      solana-sdk:
        patterns:
          - "solana"
          - "solders"

  - package-ecosystem: "pip"
    directory: "/node-agent"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/cli"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/blockchain"
    schedule:
      interval: "weekly"
    groups:
      solana-sdk:
        patterns:
          - "solana"
          - "solders"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
