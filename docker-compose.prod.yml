# Production overlay -- use alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What this changes vs. local dev:
#   - Traefik gets real Let's Encrypt certs (HTTP-01, one cert per hostname
#     as it appears -- no wildcard cert needed, so no DNS provider API key
#     is required, just a wildcard A record; see DEPLOY.md).
#   - control-plane and dashboard are reached through Traefik on
#     api.$BASE_DOMAIN / console.$BASE_DOMAIN instead of raw published
#     ports, so they get real TLS too.
#   - The registry is no longer published to the internet -- only the
#     node agent needs it, and the real deploy path (`dhost ship`) never
#     has the CLI touch the registry directly, so nothing loses function.
#   - Traefik's dashboard API stops running in insecure mode.
#   - node-agent gets PUBLIC_SCHEME=https, which does two things: every
#     future deployment's own subdomain also gets a real Let's Encrypt
#     cert (not just control-plane/dashboard), and any generated
#     sitemap.xml/robots.txt for static sites gets the right scheme in
#     their URLs.

services:
  traefik:
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  registry:
    ports: !reset []

  control-plane:
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`api.${BASE_DOMAIN}`)"
      - "traefik.http.routers.control-plane.entrypoints=websecure"
      - "traefik.http.routers.control-plane.tls.certresolver=letsencrypt"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8000"

  dashboard:
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`console.${BASE_DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.dashboard.loadbalancer.server.port=80"

  node-agent:
    environment:
      PUBLIC_SCHEME: "https"

volumes:
  letsencrypt:
